; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC4827W543]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
build_flags = 
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
    -DMETEO_ARCHIVE_MAX_FILES=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
board_build.filesystem = littlefs
build_src_filter = +<*> -<audio_test.cpp>
lib_deps =
    https://github.com/moononournation/Arduino_GFX
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.4
    .2
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
;------------------------------------------------------------
; Minimal I2S audio test (standalone).
; Compiles ONLY src/audio_test.cpp — no main.cpp, no LVGL, no WiFi.
; Select this env in PlatformIO IDE to flash the test firmware.
;------------------------------------------------------------
[env:audio_test]
extends = env:JC4827W543
build_src_filter = -<*> +<audio_test.cpp>
lib_deps =
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
